[package]
name = "discord-status"
version = "1.0.0"
edition = "2021"
description = "Discord Rich Presence that follows whatever app is in the foreground"
license = "MIT"

[[bin]]
name = "DiscordStatus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
egui = "0.31"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["ico"] }

[profile.release]
opt-level = 2
